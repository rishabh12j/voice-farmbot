# GrowMate Garden Configuration — greenhouse "gh1" (Maynooth, 54-plant)
# Per-greenhouse config. Select it with the launch `config` arg or
# `--config .../gh1.yaml` on the intent server / scheduler. The second
# greenhouse uses config/farmbotdev.yaml. (config/farmbot.yaml is the legacy
# default and mirrors this file for the desktop client.)

robot:
  name: "GrowMate"
  model: "FarmBot Genesis XL"
  workspace:
    x_max: 5691.2  # mm — long axis (Genesis XL)
    y_max: 2734.0  # mm — short axis
    z_min: -500    # mm (negative = into soil)
    z_max: 0

# Your garden - where plants are located
# The AI uses this to resolve "the tomatoes" -> coordinates
garden:
  plants:
    # Real Maynooth garden — 42 plants, positions from active_map.yaml
    # Representative (central) plant used per type for voice targeting.

    - name: lettuce
      aliases: [the lettuce, lettuce bed, little gem, salad, salad greens]
      position: {x: 1850, y: 1100, z: 0}   # plant #12 of 8 Lettuce_little_gem
      water_quantity: 2
      stage: seedling

    - name: marigold
      aliases: [the marigold, marigolds, marigold bed]
      position: {x: 1150, y: 1150, z: 0}   # plant #3 of 6 Marigolds
      water_quantity: 2
      stage: seedling

    - name: scallion
      aliases: [the scallion, scallions, spring onion, spring onions]
      position: {x: 2400, y: 1450, z: 0}   # plant #16 of 9 Scallions
      water_quantity: 1
      stage: seedling

    - name: pepper
      aliases: [the pepper, peppers, mixed pepper, mixed peppers, chilli]
      position: {x: 2700, y: 1150, z: 0}   # plant #20 of 8 Mixed Peppers
      water_quantity: 2
      stage: seedling

    - name: tomatoes
      aliases: [the tomatoes, tomato bed, tomato plants, tomato section]
      position: {x: 4250, y: 1150, z: 0}   # plant #34 of 11 Tomatoes
      water_quantity: 2
      stage: seedling

    # Herbs — placeholders, refine x/y once they're planted
    - name: basil
      aliases: [the basil, basil pot, basil patch]
      position: {x: 1500, y: 800, z: 0}
      water_quantity: 2
      stage: seedling

    - name: spearmint
      aliases: [the spearmint, spearmint, mint, the mint]
      position: {x: 1500, y: 1200, z: 0}
      water_quantity: 2
      stage: seedling

    # Ornamental flowers — placeholders, update after planting
    - name: lily
      aliases: [the lily, lilies, the lilies, asiatic lily]
      position: {x: 3500, y: 400, z: 0}
      water_quantity: 3
      stage: seedling

    - name: geranium
      aliases: [the geranium, geraniums, the geraniums, pelargonium]
      position: {x: 3500, y: 800, z: 0}
      water_quantity: 2
      stage: seedling

    - name: cardinal flower
      aliases: [cardinal flowers, the cardinal flower, cardinal, lobelia]
      position: {x: 3500, y: 1200, z: 0}
      water_quantity: 4
      stage: seedling

    - name: dianthus
      aliases: [the dianthus, dianthuses, carnation, sweet william]
      position: {x: 3500, y: 1600, z: 0}
      water_quantity: 2
      stage: seedling

    - name: euonymus
      aliases: [the euonymus, euonymus shrub, the shrub]
      position: {x: 5200, y: 2400, z: 0}
      water_quantity: 4
      stage: seedling

    - name: petunia
      aliases: [the petunia, petunias, the petunias]
      position: {x: 3500, y: 2000, z: 0}
      water_quantity: 2
      stage: seedling

    - name: begonia
      aliases: [the begonia, begonias, the begonias]
      position: {x: 3500, y: 2400, z: 0}
      water_quantity: 2
      stage: seedling

  locations:
    - name: home
      aliases: [home position, start, origin, starting position]
      position: {x: 0, y: 0, z: 0}

    - name: bed 1
      aliases: [bed one, first bed]
      position: {x: 0, y: 0, z: 0}

    - name: bed 2
      aliases: [bed two, second bed]
      position: {x: 0, y: 1400, z: 0}

    - name: bed 3
      aliases: [bed three, third bed]
      position: {x: 0, y: 2700, z: 0}   # placeholder — clamp to <2734 (Genesis XL y_max)

# FarmBot ROS2 command reference (from AURA documentation)
# The AI Core needs to know what commands exist
commands:
  movement:
    - code: "M {x} {y} {z}"
      description: "Move gantry to absolute position"
    - code: "M_S {x} {y} {z} {speed}"
      description: "Move gantry to position at speed (%)"
    - code: "H_0"
      description: "Go to home position"

  estop:
    - code: "e"
      description: "Emergency stop - halts everything"
    - code: "E"
      description: "Reset emergency stop"

  plants:
    - code: "P_4"
      description: "Water all plants regardless of moisture"
    - code: "P_5"
      description: "Water all plants based on moisture levels"
    - code: "P_9"
      description: "Check moisture levels around all plants"

  devices:
    - code: "D_W_1"
      description: "Turn water pump ON"
    - code: "D_W_0"
      description: "Turn water pump OFF"
    - code: "D_L_1"
      description: "Turn LED strip ON"
    - code: "D_L_0"
      description: "Turn LED strip OFF"
    - code: "D_V_1"
      description: "Turn vacuum pump ON"
    - code: "D_V_0"
      description: "Turn vacuum pump OFF"
    - code: "D_S_C"
      description: "Read soil sensor"
    - code: "D_C"
      description: "Check if tool is mounted"

  vision:
    - code: "I_1"
      description: "Take photo at current position"
    - code: "I_2"
      description: "Create panorama of whole bed"
    - code: "I_4"
      description: "Detect weeds"

# Tool heads on the Universal Tool Mount (UTM).
# growmate_pi uses `index` at runtime (it publishes T<index>_1 / _2). The
# x/y/z/release_dir are for the one-time `T_<index>_0` registration into the
# active map — the AURA stack reads positions from there for the mount moves.
# Measure with tools/calibrate_tools.py; release_dir is the horizontal slide
# that frees the tool from its bay slot (1=-x, 2=+x, 3=-y, 4=+y).
tools:
  # gh1 bay: one row along the x=10 edge, slots 100 mm apart in Y, all slide
  # +x to release. Physical slot order (2026-07): soil sensor, watering
  # nozzle, weeder, rotating weeder, seeder, then two seed trays.
  # y=1760/1860 measured with calibrate_tools.py (2026-06); the rest are
  # +100 mm steps from those anchors. Indices stay logical (EnsureTool
  # names -> T<n>), so they don't follow the physical slot order.
  soil_sensor:     {index: 1, x: 10.0, y: 1760.0, z: -285.04, release_dir: 2}
  watering_nozzle: {index: 2, x: 10.0, y: 1860.0, z: -285.04, release_dir: 2}
  weeder:          {index: 4, x: 10.0, y: 1960.0, z: -285.04, release_dir: 2}
  rotating_weeder: {index: 5, x: 10.0, y: 2060.0, z: -285.04, release_dir: 2}
  seeder:          {index: 3, x: 10.0, y: 2160.0, z: -285.04, release_dir: 2}
  # Seed trays are registered via S_n_0 (not T_n_0) when the seeding phase
  # starts, e.g. "S_1_0 0 Tray1 <plant> 10.0 2260.0 -285.04". Same +100 mm
  # bay spacing; verify tray z on hardware before first use.
  # seed_tray_1: {x: 10.0, y: 2260.0, z: -285.04}
  # seed_tray_2: {x: 10.0, y: 2360.0, z: -285.04}

# UTM seat pin (63) on THIS robot is hardware-modified to read V0 (mounted)
# permanently — the V0/V1 detection caused problems and was bypassed
# (2026-07-06, operator change). Pin observations therefore confirm nothing:
# tool changes fall back to choreography-completion evidence, spoken honestly
# as "sequence completed", never "verified". Record in the deviations ledger.
tool_verify_pin: false

# Soil-sensor interpretation (audit F4). calibrated stays FALSE until the
# runbook B6 procedure measures this sensor in this soil (probe in air / dry
# soil / watered soil) and writes the real thresholds here. Until then:
# check_sensor speaks the raw number without a dry/wet verdict, and
# water_smart refuses cleanly. Flip calibrated: true only with measured values.
soil:
  dry_above: 600   # placeholder — assumes higher = drier; MEASURE before trusting
  wet_below: 350   # placeholder
  calibrated: false

# Safety rules
safety:
  emergency_phrases:
    - stop
    - halt
    - emergency
    - emergency stop
    - freeze
    - abort
  workspace_bounds:
    x: [0, 5691.2]
    y: [0, 2734.0]
    z: [-500, 0]
  dangerous_commands:
    - "P_3"  # Seeding all - resource intensive
  always_confirm:
    - water_all
    - calibrate

# Daily watering time — edit this to change when P_4 fires each day.
schedule:
  watering_time: "08:00"

# Location context for weather and plant advice queries
location:
  name: "Maynooth"
  country: "Ireland"
  latitude: 53.385
  longitude: -6.601
